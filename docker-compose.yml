services:
  backend:
    build: ./backend
    container_name: ai-ticket-backend
    ports:
      - "8080:8080"
    volumes:
      - ./backend/app.db:/app/app.db
      - ./backend/chroma_db:/app/chroma_db
    env_file:
      - ./backend/.env

  frontend:
    build: ./frontend
    container_name: ai-ticket-frontend
    ports:
      - "80:80"
    depends_on:
      - backend